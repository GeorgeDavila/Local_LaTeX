<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local LaTeX Editor</title>

  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
  
  <!-- Split.js for resizable panes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>

  <link rel="stylesheet" href="index.css">
  <script src="handle_tex.js"></script>
</head>
<body>
  <header>
    <nav>
      <!-- <a href="#" class="active">Home</a> -->
      <a href="#" id="projects-btn">Projects</a>
      <a href="#" id="save-btn">Save</a>
    </nav>
    <div class="logo">
      <!-- <span>{ }</span> -->
      <span class="latex" id="current-project-name">Untitled</span>
    </div>
  </header>

  <div id="workspace">
    <aside id="projects-sidebar" aria-hidden="true">
      <div class="sidebar-header">
        <h2>Projects</h2>
        <div class="sidebar-actions">
          <button type="button" id="new-project-btn">New Project</button>
          <button type="button" id="close-projects-btn" aria-label="Close projects">×</button>
        </div>
      </div>
      <ul id="project-list"></ul>
    </aside>

    <div id="playground">
      <div id="editor-pane">
        <textarea id="editor"></textarea>
      </div>
      <div id="gutter"></div>
      <div id="preview-pane">
        <iframe id="preview" sandbox="allow-same-origin allow-scripts"></iframe>
      </div>
    </div>
  </div>

  <div id="name-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-name></div>
    <div class="modal-panel" role="dialog" aria-labelledby="name-modal-title" aria-modal="true">
      <h2 id="name-modal-title">Name project</h2>
      <p id="name-modal-desc">Choose a name. It will be saved under <code>tex_projects</code>.</p>
      <label for="name-filename">Filename</label>
      <input id="name-filename" type="text" spellcheck="false" autocomplete="off">
      <div class="modal-actions">
        <button type="button" class="btn-secondary" data-close-name>Cancel</button>
        <button type="button" class="btn-primary" id="name-confirm-btn">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { parse, HtmlGenerator } from "https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/latex.mjs";

    // Required so preview iframe can load article/katex CSS + fonts
    const LATEX_CDN = "https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/";

    // Default showcase document (same as original playground)
    const showcase = `\\documentclass{article}

\\usepackage{comment, multicol}
\\usepackage{hyperref}

\\usepackage{calc,pict2e,picture}
\\usepackage{textgreek, textcomp, gensymb, stix}

\\setcounter{secnumdepth}{2}

\\title{\\LaTeX.js Showcase}
\\author{made with $\\varheartsuit$ by Michael Brade}
\\date{2017--2021}

\\begin{document}
\\maketitle

\\begin{abstract}
This document will show most of the features of \\LaTeX.js while at the same time being a
gentle introduction to \\LaTeX. In the appendix, the API as well as the format of custom macro definitions
in JavaScript will be explained.
\\end{abstract}

\\section{Characters}

It is possible to input any UTF-8 character either directly or by character code using one
of the following:

\\begin{itemize}
  \\item \\texttt{\\textbackslash symbol\\{"00A9\\}}: \\symbol{"00A9}
  \\item \\verb|\\char"A9|: \\char"A9
  \\item \\verb|^^A9 or ^^^^00A9|: ^^A9 or ^^^^00A9
\\end{itemize}

\\bigskip
\\noindent
Special characters, like those:

\\begin{center}
\\$ \\& \\% \\# \\_ \\{ \\} \\~{} \\^{} \\textbackslash
\\end{center}

have to be escaped.

More than 200 symbols are accessible through macros. For instance: 30\\,°C is 86\\,°F.
See also Section~\\ref{sec:symbols}.

\\section{Spaces and Comments}

Spaces and comments, of course, work just as they do in \\LaTeX. This is an example: Su-
percalifragilisticexpialidocious

It does not matter whether you enter one or several spaces after a word, it will always
be typeset as one space—unless you force several spaces, like\\quad now.

New \\TeX users may miss whitespaces after a command. Experienced \\TeX users are
\\TeX{}perts, and know how to use whitespaces.

Longer comments can be embedded in the \\texttt{comment} environment: This is another ex-
ample for embedding comments in your document.

\\section{Dashes and Hyphens}

\\LaTeX knows four kinds of dashes. Access three of them with different numbers of consecu-
tive dashes. The fourth sign is actually not a dash at all—it is the mathematical minus
sign:

\\begin{center}
daughter-in-law, X-rated\\\\
pages 13--67\\\\
yes---or no? \\\\
$0$, $1$ and $-1$
\\end{center}

The names for these dashes are: ‘-’ hyphen, ‘--’ en-dash, ‘---’ em-dash,
and ‘$-$’ minus sign.

\\end{document}
`;

    // Initialize CodeMirror
    const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
      mode: "stex",
      theme: "monokai",
      lineNumbers: true,
      lineWrapping: true,
      matchBrackets: true,
      styleActiveLine: true,
      indentUnit: 2,
      tabSize: 2,
      autofocus: true
    });

    editor.setValue(showcase);

    let currentProject = null;
    let lastSavedContent = editor.getValue();
    const currentProjectNameEl = document.getElementById("current-project-name");
    const projectsBtn = document.getElementById("projects-btn");
    const projectsSidebar = document.getElementById("projects-sidebar");
    const projectList = document.getElementById("project-list");

    function isDirty() {
      return editor.getValue() !== lastSavedContent;
    }

    function updateDirtyState() {
      const dirty = isDirty();
      window.loa.setDirty(dirty);
      const base = currentProject || "Untitled";
      currentProjectNameEl.textContent = dirty ? `${base} *` : base;
    }

    function markSaved(content = editor.getValue()) {
      lastSavedContent = content;
      updateDirtyState();
    }

    function confirmDiscard() {
      if (!isDirty()) return true;
      return confirm("You have unsaved changes. Discard them and continue?");
    }

    function setCurrentProject(name) {
      currentProject = name || null;
      updateDirtyState();
    }

    editor.on("change", updateDirtyState);
    updateDirtyState();

    async function refreshProjectList() {
      let projects = [];
      try {
        projects = await window.loa.listProjects();
      } catch (e) {
        console.error(e);
      }

      projectList.innerHTML = "";
      if (!projects.length) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "No projects yet";
        projectList.appendChild(empty);
        return;
      }

      for (const name of projects) {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = name;
        btn.title = name;
        if (name === currentProject) btn.classList.add("active");
        btn.addEventListener("click", () => openProject(name));
        li.appendChild(btn);
        projectList.appendChild(li);
      }
    }

    async function openProject(name) {
      if (name === currentProject) return;
      if (!confirmDiscard()) return;
      try {
        const { name: loadedName, content } = await window.loa.loadTex(name);
        setCurrentProject(loadedName);
        editor.setValue(content);
        markSaved(content);
        await refreshProjectList();
      } catch (e) {
        alert(`Could not open project: ${e.message}`);
      }
    }

    const saveBtn = document.getElementById("save-btn");

    async function performSave() {
      const saved = await save2tex(editor.getValue(), currentProject);
      if (!saved) return false;

      setCurrentProject(saved);
      markSaved();
      await refreshProjectList();

      const original = saveBtn.dataset.label || saveBtn.textContent;
      saveBtn.dataset.label = original;
      saveBtn.classList.remove("saved");
      saveBtn.classList.add("saving");
      saveBtn.textContent = "Saved ✓";
      void saveBtn.offsetWidth;
      saveBtn.classList.add("saved");
      clearTimeout(saveBtn._savedTimer);
      saveBtn._savedTimer = setTimeout(() => {
        saveBtn.classList.remove("saving", "saved");
        saveBtn.textContent = original;
      }, 900);
      return true;
    }

    window.loa.onRequestSaveBeforeClose(async () => performSave());

    saveBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      await performSave();
    });

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        performSave();
      }
    });

    function setProjectsSidebarOpen(open) {
      projectsSidebar.classList.toggle("open", open);
      projectsSidebar.setAttribute("aria-hidden", open ? "false" : "true");
      projectsBtn.classList.toggle("active", open);
    }

    projectsBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      const open = !projectsSidebar.classList.contains("open");
      setProjectsSidebarOpen(open);
      if (open) await refreshProjectList();
    });

    document.getElementById("close-projects-btn").addEventListener("click", () => {
      setProjectsSidebarOpen(false);
    });

    document.getElementById("new-project-btn").addEventListener("click", async () => {
      if (!confirmDiscard()) return;
      const created = await createNewProject();
      if (!created) return;
      setCurrentProject(created.name);
      editor.setValue(created.content);
      markSaved(created.content);
      setProjectsSidebarOpen(true);
      await refreshProjectList();
    });

    // Generator instance (reused)
    const generator = new HtmlGenerator({ hyphenate: false });

    const iframe = document.getElementById("preview");
    let scrollY = 0;

    function compile(latex) {
      const doc = iframe.contentDocument;
      if (!doc || doc.readyState !== "complete") {
        // wait a bit if iframe not ready
        setTimeout(() => compile(latex), 50);
        return;
      }

      try {
        generator.reset();
        const newDoc = parse(latex, { generator }).htmlDocument(LATEX_CDN);

        // Keep scroll position across re-renders when possible
        if (doc.head.innerHTML === newDoc.head.innerHTML) {
          const newBody = doc.adoptNode(newDoc.body);
          doc.documentElement.replaceChild(newBody, doc.body);
          doc.documentElement.style.cssText = newDoc.documentElement.style.cssText;
        } else {
          iframe.srcdoc = newDoc.documentElement.outerHTML;
        }

        if (scrollY) {
          iframe.contentWindow.scrollTo(0, scrollY);
          scrollY = 0;
        }
      } catch (e) {
        console.error(e);
        if (!scrollY && iframe.contentWindow) {
          scrollY = iframe.contentWindow.pageYOffset || 0;
        }
        doc.body.innerHTML = `<pre style="color:#c00;padding:1rem;white-space:pre-wrap;font-family:monospace">ERROR: ${e.message}</pre>`;
      }
    }

    // Initial compile + live updates (debounced)
    let timer;
    function scheduleCompile() {
      clearTimeout(timer);
      timer = setTimeout(() => compile(editor.getValue()), 250);
    }

    editor.on("change", scheduleCompile);

    // Make sure iframe is ready, then compile
    iframe.onload = () => compile(editor.getValue());
    // Force first load
    iframe.srcdoc = "<!DOCTYPE html><html><head></head><body></body></html>";

    // Resizable split
    Split(["#editor-pane", "#preview-pane"], {
      sizes: [50, 50],
      minSize: 200,
      gutterSize: 8,
      cursor: "col-resize",
      gutter: (index, direction) => {
        const gutter = document.getElementById("gutter");
        return gutter;
      }
    });
  </script>
</body>
</html>
